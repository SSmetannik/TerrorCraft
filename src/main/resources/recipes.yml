# Предметы:  "MATERIAL"  |  "ia:namespace:id" (ItemsAdder)  |  "MATERIAL x3"
# или подробно: { item: ..., amount: 2, name: "&a...", lore: [...], glow: true, match-name: true }
#
# Этапы (stages):
#   type: insert  — положить ингредиенты (ПКМ по станции с предметом в руке, Shift+ПКМ — всё из инвентаря)
#                   items: [...], time: лимит в секундах
#   type: wait    — подождать: time, particle, sound
#   type: game    — мини-игра: game: timing | forge | stir | heat | memory | bubbles, time: лимит
#                   + настройки игры (см. README)
#
# return-items-on-fail: true — при провале вернуть ингредиенты (по умолчанию сгорают)

recipes:
  antidote:
    name: "&aПротивоядие"
    description: ["&7Снимает отравление токсичным дождём"]
    stages:
      - type: insert
        name: "Ингредиенты"
        time: 45
        items:
          - GLASS_BOTTLE
          - item: ia:toxicrain:toxic_essence
            amount: 1
          - GLOW_BERRIES x3
      - type: game
        game: stir
        name: "Размешай отвар"
        time: 25
        turns: 4
      - type: game
        game: heat
        name: "Доведи до кипения"
        time: 30
        zone: [55, 75]
        hold: 7
      - type: wait
        name: "Настаивается"
        time: 6
        particle: BUBBLE_POP
        sound: block.brewing_stand.brew
    rewards:
      items:
        - item: HONEY_BOTTLE
          name: "&aПротивоядие"
          lore: ["&7Снимает токсин", "&8Сварено в токсичном котле"]
          glow: true
      xp: 5

  purified_essence:
    name: "&bОчищенная эссенция"
    description: ["&7Токсин, превращённый во что-то полезное"]
    stages:
      - type: insert
        name: "Загрузи эссенцию"
        time: 40
        items:
          - item: ia:toxicrain:toxic_essence
            amount: 3
          - CHARCOAL x2
      - type: game
        game: bubbles
        name: "Лопай токсичные пузыри"
        time: 35
        target: 18
        misses: 5
      - type: wait
        name: "Осадок оседает"
        time: 5
        particle: DRIPPING_WATER
    rewards:
      items:
        - item: GLOWSTONE_DUST
          name: "&bОчищенная эссенция"
          lore: ["&7Чистая энергия токсичного дождя"]
          glow: true
      xp: 8

  toxic_blade:
    name: "&2Токсичный клинок"
    description: ["&7Меч, закалённый в токсине"]
    return-items-on-fail: true
    stages:
      - type: insert
        name: "Металл и токсин"
        time: 45
        items:
          - IRON_INGOT x4
          - item: ia:toxicrain:toxic_essence
            amount: 2
          - STICK
      - type: game
        game: heat
        name: "Раскали горн"
        time: 30
        zone: [70, 90]
        hold: 6
      - type: game
        game: forge
        name: "Куй в ритм"
        time: 30
        hits: 10
        interval: 16
        window: 3
      - type: wait
        name: "Закалка"
        time: 4
        particle: LARGE_SMOKE
        sound: block.lava.extinguish
    rewards:
      items:
        - item: IRON_SWORD
          name: "&2Токсичный клинок"
          lore: ["&7Закалён в токсине"]
          glow: true
      xp: 12

  medkit:
    name: "&cАптечка"
    description: ["&7Шифт+ПКМ — лечение"]
    stages:
      - type: insert
        name: "Материалы"
        time: 40
        items:
          - PAPER x2
          - WHITE_WOOL
          - GLISTERING_MELON_SLICE
      - type: game
        game: memory
        name: "Смешай по рецепту"
        time: 45
        rounds: 3
        start-length: 3
        items: [GLISTERING_MELON_SLICE, SUGAR, GHAST_TEAR, GLOW_BERRIES, HONEY_BOTTLE]
      - type: game
        game: timing
        name: "Наложи шов"
        time: 25
        hits: 4
        zone: 3
    rewards:
      items:
        - ia:items:medkit
      xp: 6

  gas_filter:
    name: "&7Фильтр противогаза"
    description: ["&7Защита от токсичных испарений"]
    stages:
      - type: insert
        name: "Детали фильтра"
        time: 40
        items:
          - CHARCOAL x4
          - WHITE_WOOL x2
          - IRON_NUGGET x6
      - type: game
        game: timing
        name: "Подгони детали"
        time: 25
        hits: 6
        zone: 2
        speed: 0.4
      - type: game
        game: bubbles
        name: "Продуй фильтр"
        time: 30
        target: 12
        clean-chance: 0.35
    rewards:
      items:
        - item: PAPER
          name: "&7Фильтр противогаза"
          lore: ["&8Вставь в противогаз"]
      xp: 6
